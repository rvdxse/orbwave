[project]
name = "orbwave"
version = "0.1.1"
description = "Real-time audio visualizer with a spinning album cover"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "rvdxse" }
]
requires-python = ">=3.12"
dependencies = [
    "jeepney>=0.9.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pygame>=2.6.1",
    "requests>=2.34.2",
    "soundcard>=0.4.6",
]
keywords = ["audio", "visualizer", "pygame", "music", "spectrum"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
[project.urls]
Repository = "https://github.com/rvdxse/orbwave"

[project.scripts]
orbwave = "orbwave:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
